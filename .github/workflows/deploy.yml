name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build Docker Image
        run: docker build -t devops-challenge-backend:latest .

      - name: Load Image into Minikube
        run: minikube image load devops-challenge-backend:latest

      - name: Deploy Manifests to Kubernetes
        run: |
          kubectl apply -f k8s/01-postgres.yaml
          kubectl apply -f k8s/02-backend.yaml
          kubectl apply -f k8s/03-ingress.yaml
          kubectl rollout restart deployment/backend-api
